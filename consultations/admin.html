<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة استشارة خبرات</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script></head><body><main class="section"><div class="wrap"><div class="section-head"><span class="eyebrow">لوحة الإدارة</span><h2>استشارة خبرات</h2></div><section id="loginBox" class="form-card narrow"><form id="loginForm"><label>البريد الإداري<input type="email" name="email" required></label><label>كلمة المرور<input type="password" name="password" required></label><div id="loginMsg" class="msg" hidden></div><button class="btn full">دخول</button></form></section><section id="adminBox" hidden><div id="stats" class="stats"></div><div class="form-card" style="margin-top:20px"><div class="grid2"><label>بحث<input id="search" placeholder="الاسم أو البريد أو الجهة"></label><label>الحالة<select id="statusFilter"><option value="">الكل</option><option>new</option><option>reviewing</option><option>accepted</option><option>waitlist</option><option>declined</option><option>booked</option><option>completed</option></select></label></div><div id="requests"></div></div></section></div></main><script src="./admin.js"></script></body></html>
